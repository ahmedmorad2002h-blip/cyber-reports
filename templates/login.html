<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العمليات السيبرانية</title>
    <!-- مكتبة Three.js لعرض الكرة الأرضية ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background-color: #0f172a; color: #fff; font-family: Tahoma, sans-serif; }
        #globe-container { width: 100%; height: 450px; position: relative; }
        .dashboard-header { padding: 20px; background: #1e293b; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h2>لوحة تحكم العمليات السيبرانية</h2>
    </div>
    <div id="globe-container"></div>

    <script>
        function initGlobe() {
            const container = document.getElementById('globe-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            
            // التصحيح البرمجي: استخدام clientWidth بحرف صغير لضمان عمل الرسوميات
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // تصميم مجسم الكرة الأرضية
            const geometry = new THREE.SphereGeometry(2, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
            const globe = new THREE.Mesh(geometry, material);
            scene.add(globe);

            camera.position.z = 5;

            function animate() {
                requestAnimationFrame(animate);
                globe.rotation.y += 0.003;
                renderer.render(scene, camera);
            }
            animate();

            // الاستجابة لتغيير حجم نافذة المتصفح
            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        // استدعاء الدالة تلقائياً عند تحميل الصفحة بالكامل
        window.addEventListener('DOMContentLoaded', () => {
            initGlobe();
        });
    </script>
</body>
</html>
