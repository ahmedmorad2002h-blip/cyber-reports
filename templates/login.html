<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - مديرية أمن وسلامة الوزارة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #030712; 
            color: #f0f6fc; 
            font-family: 'Cairo', sans-serif;
            background-image: radial-gradient(circle at 50% 10%, #0f172a 0%, #030712 80%);
        }
        .card { 
            background: rgba(11, 19, 38, 0.95); 
            border: 1px solid rgba(0, 242, 254, 0.35); 
            border-radius: 16px; 
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.12), 0 10px 30px rgba(0,0,0,0.8); 
            backdrop-filter: blur(15px);
        }
        input { background: rgba(3, 7, 18, 0.9) !important; border: 1px solid rgba(0, 242, 254, 0.3) !important; color: #fff !important; border-radius: 10px !important; padding: 12px !important;}
        input:focus { border-color: #00f2fe !important; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4) !important; outline: none; }
        .btn-cyber {
            background: linear-gradient(135deg, #0072ff, #00f2fe);
            border: none;
            color: #030712;
            font-weight: 800;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            transition: all 0.2s;
        }
        .btn-cyber:hover {
            background: linear-gradient(135deg, #005bc5, #00c6ff);
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 410px;">
        <div class="text-center mb-3 pt-2">
            <i class="fa-solid fa-shield-halved fa-3x" style="color: #00f2fe; filter: drop-shadow(0 0 10px rgba(0,242,254,0.5));"></i>
        </div>
        <h4 class="text-center mb-1 fw-bold" style="color: #00f2fe;">مديرية أمن وسلامة الوزارة</h4>
        <p class="text-center text-muted small mb-4">بوابة الدخول لنظام الرصد والتحقيقات</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'success' else 'info' }} p-2 text-center text-dark fw-bold mb-3" style="border-radius: 8px;">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold small">اسم المستخدم</label>
                <input type="text" name="username" class="form-control" required placeholder="أدخل اسم المستخدم...">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small">كلمة المرور</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-cyber w-100 py-3 fw-bold">تسجيل الدخول للنظام</button>
        </form>
    </div>
</body>
</html>
