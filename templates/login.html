<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - مديرية أمن وسلامة الوزارة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050b14; color: #e2f1ff; font-family: 'Cairo', sans-serif; background-image: radial-gradient(circle at 50% 10%, #0a192f 0%, #050b14 70%); }
        .card { background: rgba(10, 18, 32, 0.95); border: 1px solid rgba(0, 242, 254, 0.4); border-radius: 14px; box-shadow: 0 0 30px rgba(0, 242, 254, 0.15); }
        input { background: rgba(5, 12, 22, 0.9) !important; border: 1px solid rgba(0, 242, 254, 0.3) !important; color: #fff !important; }
        input:focus { border-color: #00f2fe !important; box-shadow: 0 0 10px rgba(0, 242, 254, 0.5) !important; }
        .btn-cyber { background: linear-gradient(135deg, #0072ff, #00f2fe); border: none; color: #000; font-weight: 700; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
        .btn-cyber:hover { background: linear-gradient(135deg, #005bc5, #00c6ff); color: #fff; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 390px;">
        <div class="text-center mb-3">
            <i class="fa-solid fa-shield-halved fa-2x" style="color: #00f2fe;"></i>
        </div>
        <h4 class="text-center mb-4" style="color: #00f2fe;">مديرية أمن وسلامة الوزارة</h4>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'success' else 'info' }} p-2 text-center text-dark fw-bold">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-cyber w-100 py-2">تسجيل الدخول للنظام</button>
        </form>
    </div>
</body>
</html>
